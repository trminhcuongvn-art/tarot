<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" class="back-art" preserveAspectRatio="xMidYMid meet">
  <!-- PLACEHOLDER card-back: họa tiết vàng-tím. Thay bằng ảnh thật sau. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#160c2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="188" height="308" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.9"/>
  <rect x="14" y="14" width="172" height="292" rx="9" fill="url(#g)" stroke="#D4AF37" stroke-width="0.7" opacity="0.7"/>
  <!-- central star/sun motif -->
  <g transform="translate(100,160)" fill="none" stroke="#D4AF37" stroke-width="1.1">
    <circle r="42" opacity="0.9"/>
    <circle r="30" opacity="0.55"/>
    <circle r="18" opacity="0.4"/>
    <g opacity="0.95">
      <path d="M0,-58 L6,-44 L0,-44 Z" fill="#F5D061" stroke="none"/>
      <path d="M0,58 L6,44 L0,44 Z" fill="#F5D061" stroke="none"/>
      <path d="M-58,0 L-44,6 L-44,0 Z" fill="#F5D061" stroke="none"/>
      <path d="M58,0 L44,6 L44,0 Z" fill="#F5D061" stroke="none"/>
    </g>
    <!-- 8-point sparkle -->
    <g stroke="#F5D061" stroke-width="1">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-35" y1="-35" x2="35" y2="35"/>
      <line x1="-35" y1="35" x2="35" y2="-35"/>
    </g>
    <circle r="7" fill="#F5D061" stroke="none"/>
  </g>
  <!-- corner flourishes -->
  <g stroke="#D4AF37" stroke-width="0.9" fill="none" opacity="0.8">
    <path d="M30,40 q-12,-10 0,-20"/>
    <path d="M170,40 q12,-10 0,-20"/>
    <path d="M30,280 q-12,10 0,20"/>
    <path d="M170,280 q12,10 0,20"/>
  </g>
  <!-- scattered gold dust dots -->
  <g fill="#F5D061" opacity="0.7">
    <circle cx="50" cy="70" r="1.4"/><circle cx="150" cy="80" r="1.2"/>
    <circle cx="42" cy="250" r="1.3"/><circle cx="158" cy="240" r="1.5"/>
    <circle cx="100" cy="55" r="1.1"/><circle cx="100" cy="265" r="1.1"/>
  </g>
</svg>
