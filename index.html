<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Huyền Bí · Hỏi Vũ Trụ Một Điều</title>
  <meta name="description" content="Rút bài Tarot Rider-Waite trực tuyến: rút 1 lá hoặc trải 3 lá Quá khứ - Hiện tại - Tương lai, luận giải tiếng Việt.">
  <meta property="og:title" content="Tarot Huyền Bí · Hỏi Vũ Trụ Một Điều">
  <meta property="og:description" content="Không gian rút bài Tarot trực tuyến với bộ Rider-Waite và luận giải tiếng Việt.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trminhcuongvn-art.github.io/tarot/">
  <meta property="og:image" content="https://trminhcuongvn-art.github.io/tarot/assets/card-back.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260531-redesign2">
</head>
<body>
  <div id="tsparticles" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <nav class="mystic-nav reveal" aria-label="Điều hướng Tarot">
    <a href="#ritual">Nghi lễ</a>
    <a href="#spread">Trải bài</a>
    <a href="#readings">Luận giải</a>
    <a href="cards.html">78 lá</a>
  </nav>

  <main class="wrap" id="ritual">
    <header class="hero reveal">
      <p class="eyebrow">Rider-Waite · 78 lá</p>
      <h1>Tarot huyền bí</h1>
      <div class="subtitle">Hỏi vũ trụ một điều, để trực giác trả lời trong tĩnh lặng.</div>
    </header>

    <section class="altar reveal" aria-label="Khu vực nhập câu hỏi và rút bài">
      <div class="question-box">
        <label class="sr-only" for="question">Câu hỏi dành cho trải bài</label>
        <input id="question" type="text" placeholder="Thầm hỏi điều bạn muốn biết… (tùy chọn)">
      </div>

      <div class="controls" aria-label="Tùy chọn trải bài">
        <div class="mode-group" role="tablist" aria-label="Chế độ trải bài">
          <button class="mode-btn active" data-mode="one" type="button">Rút 1 lá</button>
          <button class="mode-btn" data-mode="three" type="button">Trải 3 lá</button>
          <button class="mode-btn" data-mode="five" type="button">Trải 5 lá</button>
          <button class="mode-btn" data-mode="celtic" type="button">Celtic Cross</button>
        </div>
        <button id="shareBtn" class="icon-btn" title="Chia sẻ kết quả" type="button" aria-label="Chia sẻ kết quả" disabled>🔗</button>
        <button id="soundBtn" class="icon-btn off" title="Bật/tắt âm thanh nghi lễ" type="button" aria-label="Bật hoặc tắt âm thanh">🔇</button>
      </div>

      <button id="drawBtn" class="btn-ritual" type="button"><span>✦</span><strong>Bắt đầu nghi lễ</strong></button>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>

    <section id="spread" class="spread reveal" aria-live="polite" aria-label="Các lá bài đã rút"></section>
    <section id="readings" class="readings" aria-live="polite" aria-label="Luận giải lá bài"></section>

    <footer class="reveal">
      ✦ Bộ bài Rider-Waite · 78 lá · Luận giải tiếng Việt ✦<br>
      Sự thật được hé lộ, trực giác dẫn lối, những điều ẩn giấu được soi sáng.
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="js/app.js?v=20260601-phase2"></script>
</body>
</html>
